name: Model report
description: How QuickBuds works with your OnePlus, OPPO or realme earbuds.
labels: [model report]
body:
  - type: markdown
    attributes:
      value: >-
        QuickBuds supports OnePlus, OPPO and realme earbuds only. Other brands use a different
        protocol, and QuickBuds cannot connect to them.
  - type: dropdown
    id: brand
    attributes:
      label: Brand
      options: [OnePlus, OPPO, realme]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Earbuds model
      description: As in the README's Supported earbuds list.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Phone or PC
      description: Model and Android, Windows or Linux version.
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: What works and what does not
      description: '"The switch flips but nothing changes on the buds" is useful.'
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Dev tools › Clear, try the features, then Dev tools › Export. The file lands in
        Download/QuickBuds/ (PC: Downloads/QuickBuds). Attach it here.
